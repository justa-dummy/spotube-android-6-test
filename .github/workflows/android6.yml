name: Android 6 build

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Force Rust 1.99 for every rustup/cargo call (overrides toolchain files and defaults).
  # Cargo 1.100 changed its build-dir layout, which Gobley 0.3.7 can't read.
  RUSTUP_TOOLCHAIN: 1.99.0
  # Android 6 backport: getrandom() is only in Bionic from Android 9; make the getrandom
  # crate use the raw syscall. (Same as .cargo/config.toml, in case that file is missing.)
  CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_RUSTFLAGS: --cfg getrandom_backend="linux_raw"
  COMPOSE_WEBVIEW_REPO: KRTirtho/ComposeNativeWebview
  COMPOSE_WEBVIEW_COMMIT: b11ac748de1219f9432338c067a2c5dafef3072a

jobs:
  prepare-deps:
    name: Prepare compose-webview
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.COMPOSE_WEBVIEW_REPO }}
          ref: ${{ env.COMPOSE_WEBVIEW_COMMIT }}
          path: compose-webview
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: gradle/actions/setup-gradle@v6
      - name: Publish compose-webview to mavenLocal
        working-directory: compose-webview
        run: |
          chmod +x gradlew
          ./gradlew publishToMavenLocal
      - uses: actions/upload-artifact@v7
        with:
          name: maven-local
          path: ~/.m2/repository/

  build-android:
    name: Android (minSdk 23)
    needs: prepare-deps
    timeout-minutes: 150
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: maven-local
          path: ~/.m2/repository/
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew
      - name: Show Rust toolchain
        working-directory: composeApp
        run: |
          rustup show
          rustc -V; cargo -V
          which -a cargo rustc
          if ! cargo -V | grep -q '^cargo 1\.99\.'; then echo "::error::Wrong Rust version"; exit 1; fi
      - name: Create a throwaway signing key
        run: |
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/ci.jks" -storepass android -keypass android \
            -alias ci -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Spotube Android 6 CI"
          ls -l "$RUNNER_TEMP/ci.jks"
      - name: Assemble (release)
        # The android.injected.signing.* properties make AGP sign with this key,
        # whatever the project's own signing config says.
        run: |
          ./gradlew :composeApp:assembleStableRelease --stacktrace \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/ci.jks" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=ci \
            -Pandroid.injected.signing.key.password=android
      - name: Show Cargo build-script folders (diagnostics)
        if: failure()
        run: |
          find composeApp/target -maxdepth 4 -path '*build/quote*' | head -20
          ls composeApp/target/release/build 2>/dev/null | head -20
      - name: Check native libraries for Android 7+ symbols
        if: always()
        run: |
          apk=$(find composeApp/build/outputs/apk -name '*.apk' | head -1)
          [ -n "$apk" ] || exit 0
          mkdir -p so && unzip -o -q "$apk" 'lib/*' -d so
          for f in so/lib/*/*.so; do
            und=$(readelf --dyn-syms -W "$f" | awk '$7=="UND"{print $8}' | sed 's/@.*//' | sort -u)
            echo "== $f"; echo $und
            for sym in getrandom getentropy pthread_getattr_np_ aligned_alloc __system_property_read_callback; do
              grep -qx "$sym" <<< "$und" && { echo "::error::$f imports $sym (needs a newer Android)"; bad=1; }
            done
          done
          [ -z "$bad" ]
      - name: Lint for Android 7+ API calls (report only)
        if: always()
        continue-on-error: true
        run: ./gradlew :composeApp:lintStableRelease -Dlint.baselines.continue=true
      - name: Collect outputs
        if: always()
        run: |
          mkdir -p out
          find composeApp/build/outputs/apk -name '*.apk' -exec cp {} out/ \; || true
          find composeApp/build/reports -name 'lint-results*' -exec cp {} out/ \; || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: spotube-android6
          path: out/
